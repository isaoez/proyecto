{% extends 'layout/base.html' %}

{% block content %}
<div class="card" style="padding: 20px; max-width: 400px; margin: 50px auto;">
    <h1>Iniciar Sesión</h1>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" class="btn">
            Entrar
        </button>
    </form>
    
    <div class="form-footer-link">
        <p>¿No tienes cuenta? <a href="{% url 'signup' %}">Registrarse</a></p>
    </div>

</div>
{% endblock %}
